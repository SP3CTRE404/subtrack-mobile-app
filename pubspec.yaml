name: subtrack
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  dio: ^5.9.2
  flutter_secure_storage: ^10.0.0
  animations: ^2.1.2
  mobile_scanner: ^7.2.0
  image_picker: ^1.2.1
  intl: ^0.20.2
  qr_flutter: ^4.1.0
  share_plus: ^12.0.2
  app_links: ^7.1.1
  local_auth: ^3.0.1
  shimmer: ^3.0.0
  flutter_local_notifications: ^21.0.0
  workmanager: ^0.9.0+3
  http: ^1.6.0
  image_cropper: ^12.2.1
  file_picker: ^11.0.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png